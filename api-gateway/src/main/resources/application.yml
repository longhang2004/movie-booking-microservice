server:
  port: 8090

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            exposedHeaders: "Authorization,X-Correlation-Id"
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**,/auth/**
          filters:
            - RewritePath=/api/v1/auth(?<segment>/?.*), /auth${segment}

        - id: movie-service
          uri: lb://movie-service
          predicates:
            - Path=/api/v1/movies/**,/movies/**
          filters:
            - RewritePath=/api/v1/movies(?<segment>/?.*), /movies${segment}

        - id: theater-service
          uri: lb://theater-service
          predicates:
            - Path=/api/v1/theaters/**,/theaters/**
          filters:
            - RewritePath=/api/v1/theaters(?<segment>/?.*), /theaters${segment}

        - id: showtime-service
          uri: lb://showtime-service
          predicates:
            - Path=/api/v1/showtimes/**,/showtimes/**
          filters:
            - RewritePath=/api/v1/showtimes(?<segment>/?.*), /showtimes${segment}

        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/v1/bookings/**,/bookings/**
          filters:
            - RewritePath=/api/v1/bookings(?<segment>/?.*), /bookings${segment}

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**,/payments/**
          filters:
            - RewritePath=/api/v1/payments(?<segment>/?.*), /payments${segment}

        - id: movie-service-docs
          uri: lb://movie-service
          predicates:
            - Path=/movies/v3/api-docs
          filters:
            - RewritePath=/movies/v3/api-docs, /v3/api-docs

        - id: theater-service-docs
          uri: lb://theater-service
          predicates:
            - Path=/theaters/v3/api-docs
          filters:
            - RewritePath=/theaters/v3/api-docs, /v3/api-docs

        - id: showtime-service-docs
          uri: lb://showtime-service
          predicates:
            - Path=/showtimes/v3/api-docs
          filters:
            - RewritePath=/showtimes/v3/api-docs, /v3/api-docs

        - id: booking-service-docs
          uri: lb://booking-service
          predicates:
            - Path=/bookings/v3/api-docs
          filters:
            - RewritePath=/bookings/v3/api-docs, /v3/api-docs

        - id: payment-service-docs
          uri: lb://payment-service
          predicates:
            - Path=/payments/v3/api-docs
          filters:
            - RewritePath=/payments/v3/api-docs, /v3/api-docs

        - id: auth-service-docs
          uri: lb://auth-service
          predicates:
            - Path=/auth/v3/api-docs
          filters:
            - RewritePath=/auth/v3/api-docs, /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:ThisIsADevOnlySecretKeyForHS256Algo!!}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /auth/v3/api-docs
      - name: Movie Service
        url: /movies/v3/api-docs
      - name: Theater Service
        url: /theaters/v3/api-docs
      - name: Showtime Service
        url: /showtimes/v3/api-docs
      - name: Booking Service
        url: /bookings/v3/api-docs
      - name: Payment Service
        url: /payments/v3/api-docs
  api-docs:
    enabled: true

logging:
  pattern:
    console: "%d{ISO8601} [%X{traceId:-}] %-5level [%thread] %logger{36} - %msg%n"
