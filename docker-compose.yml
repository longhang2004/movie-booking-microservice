x-app-env: &app-env
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  EUREKA_INSTANCE_HOSTNAME: host.docker.internal
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
  JWT_ISSUER: ${JWT_ISSUER:-movie-booking}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-movie-booking-api}
  JWT_JWK_SET_URI: http://auth-service:8096/auth/.well-known/jwks.json
  ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cinema}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cinema}

x-app-hosts: &app-hosts
  - "host.docker.internal:host-gateway"
  - "postgres:host-gateway"
  - "redis:host-gateway"
  - "kafka:host-gateway"
  - "eureka-server:host-gateway"
  - "zipkin:host-gateway"
  - "auth-service:host-gateway"
  - "movie-service:host-gateway"
  - "theater-service:host-gateway"
  - "showtime-service:host-gateway"
  - "booking-service:host-gateway"
  - "payment-service:host-gateway"
  - "api-gateway:host-gateway"
  - "prometheus:host-gateway"


services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cinema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinema}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cinema}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      - "9411:9411"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    extra_hosts: *app-hosts
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api-gateway

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    extra_hosts: *app-hosts
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  eureka-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    extra_hosts: *app-hosts
    environment:
      EUREKA_HOSTNAME: eureka-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    extra_hosts: *app-hosts
    environment:
      <<: *app-env
      REDIS_HOST: redis

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "8096:8096"
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts: *app-hosts
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db

  movie-service:
    build:
      context: ./movie-service
      dockerfile: Dockerfile
    ports:
      - "8091:8091"
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts: *app-hosts
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/movie_db
      REDIS_HOST: redis

  theater-service:
    build:
      context: ./theater-service
      dockerfile: Dockerfile
    ports:
      - "8092:8092"
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts: *app-hosts
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/theater_db

  showtime-service:
    build:
      context: ./showtime-service
      dockerfile: Dockerfile
    ports:
      - "8093:8093"
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts: *app-hosts
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/showtime_db

  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    ports:
      - "8094:8094"
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    extra_hosts: *app-hosts
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    ports:
      - "8095:8095"
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    extra_hosts: *app-hosts
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

volumes:
  postgres_data:
