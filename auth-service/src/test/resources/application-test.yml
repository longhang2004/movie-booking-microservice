spring:
  datasource:
    url: jdbc:h2:mem:authdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  cloud:
    discovery:
      enabled: false
eureka:
  client:
    enabled: false
app:
  jwt:
    issuer: movie-booking
    audience: movie-booking-api
    expiration-seconds: 3600
    refresh-expiration-seconds: 86400
  auth:
    max-failed-attempts: 5
    lockout-seconds: 900
