name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  platform-security:
    name: Build & Test (platform-security)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test platform-security
        run: |
          chmod +x ./auth-service/mvnw
          ./auth-service/mvnw -f platform-security/pom.xml clean install --no-transfer-progress

  build-and-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: platform-security
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - api-gateway
          - auth-service
          - movie-service
          - theater-service
          - showtime-service
          - booking-service
          - payment-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install platform-security
        run: |
          chmod +x ./auth-service/mvnw
          ./auth-service/mvnw -f platform-security/pom.xml clean install -DskipTests --no-transfer-progress

      - name: Build and test ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: |
          chmod +x ./mvnw
          ./mvnw clean verify --no-transfer-progress

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: ./${{ matrix.service }}/target/surefire-reports/

  docker-build:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - api-gateway
          - auth-service
          - movie-service
          - theater-service
          - showtime-service
          - booking-service
          - payment-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install platform-security
        run: |
          chmod +x ./auth-service/mvnw
          ./auth-service/mvnw -f platform-security/pom.xml clean install -DskipTests --no-transfer-progress

      - name: Package ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: movie-booking/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
