apiVersion: v1
kind: Namespace
metadata:
  name: movie-booking
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: movie-booking
data:
  JWT_ISSUER: movie-booking
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
  REDIS_HOST: redis
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: movie-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: movie-booking/discovery-server:latest
          ports:
            - containerPort: 8761
          env:
            - name: EUREKA_HOSTNAME
              value: eureka-server
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: movie-booking
spec:
  selector:
    app: eureka-server
  ports:
    - port: 8761
      targetPort: 8761
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: movie-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: movie-booking/api-gateway:latest
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: movie-booking
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8090
